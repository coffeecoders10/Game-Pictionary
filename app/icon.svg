<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="15" fill="#03182a"/>
  <rect x="1" y="1" width="62" height="62" rx="14" stroke="#0f3049" stroke-width="2"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- mug body and handle -->
    <path d="M40 36h3a6 6 0 0 1 0 12h-3.500" stroke="#e9dfd2" stroke-width="2.600"/>
    <path d="M13 30h27v12a12 12 0 0 1-12 12h-3a12 12 0 0 1-12-12z" fill="#2a211c" stroke="#e9dfd2" stroke-width="2.600"/>
    <!-- coffee surface -->
    <ellipse cx="26.500" cy="30" rx="13.500" ry="3" fill="#6b4a36" stroke="#e9dfd2" stroke-width="2.600"/>
    <!-- pencil standing in the mug -->
    <g transform="translate(27 31) rotate(16)">
      <rect x="-3.500" y="-23" width="7" height="22" fill="#c99a74"/>
      <path d="M-3.500-23L0-31l3.500 8z" fill="#e9dfd2"/>
      <path d="M-1.200-27.200L0-31l1.200 3.800z" fill="#2a211c"/>
      <rect x="-3.500" y="-23" width="7" height="2.600" fill="#84a0b6"/>
    </g>
    <!-- front rim hides the pencil's foot -->
    <path d="M13 30a13.500 3 0 0 0 27 0" stroke="#e9dfd2" stroke-width="2.600"/>
    <path d="M12 58h30" stroke="#84a0b6" stroke-width="2.600"/>
  </g>
</svg>
